server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml font/woff font/woff2;
  gzip_min_length 1024;

  # Hashed build assets are immutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Per-deployment config and the shell must never be cached.
  location = /config.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  # The API stays on Windows/IIS (.NET Framework 4.8 cannot run on Linux).
  # Proxy it here to keep the browser same-origin, or point window.dataServer
  # straight at the API host in config.js and drop this block.
  location /service/ {
    proxy_pass http://csm-api.internal/service/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SignalR 2.x long-polling / websockets
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
  }

  add_header X-Content-Type-Options "nosniff" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
